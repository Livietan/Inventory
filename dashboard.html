<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="content" style="color: #b8bbc2">
        <span style="font-weight: 600">Account as admin</span>
        <span style="font-weight: 400">you will access as admin</span>
        <span style="font-size: 20px; padding: 10px"
          >Tap to access as manager</span
        >
      </div>
      <div class="auth">
        <div
          class="auth-username"
          style="display: flex; flex-direction: column"
        >
          <span style="font-size: 22px; font-weight: 500">username</span>
          <input
            type="text"
            class="inp-username"
            placeholder="your username"
            id="username"
            maxlength="64"
          />
        </div>
        <div
          class="auth-password"
          style="display: flex; flex-direction: column"
        >
          <span style="font-size: 22px; font-weight: 500">password</span>
          <input
            type="text"
            class="inp-password"
            placeholder="your password"
            id="password"
            maxlength="32"
          />
        </div>
        <div class="auth-login" style="text-align: center">
          <span>Log-in</span>
        </div>
        <span style="color: #8f939a"
          >Don't have account?
          <span
            style="color: #e5e5e5; text-decoration: underline; cursor: pointer"
            id="register"
            >Register</span
          ></span
        >
        <span style="font-size: 12px; color: #6f7175; text-align: center"
          >Inventory System · Made by Akmal</span
        >
      </div>
    </div>
  </body>
  <script src="dashboard.js"></script>
</html>
