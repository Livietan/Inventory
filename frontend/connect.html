<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect</title>
  <link rel="stylesheet" href="css/connect.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Orbitron:wght@400..900&display=swap"
    rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Manrope:wght@200..800&family=Orbitron:wght@400..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <header>
    <img src="/assets/chatgpt.png" alt="chatgpt.png">
    <div class="text-image">
      <div class="container-text-image">
        <span class="parent">Pertahankan kendali atas gudang Anda.</span>
        <span class="child">Kendalikan segalanya dengan mudah</span>
        <span class="description">Tambahkan barang, ubah stok, dan kelola pengiriman</span>
      </div>
      <div class="btn-nav" id="btn-nav">
        Mulai
      </div>
    </div>
  </header>
  <div class="content" id="content">
    <!-- halaman daftar -->
    <div class="register" id="register">
      <div class="head-form">
        <span class="hero-form">Buat Akun</span>
        <span>Sudah punya akun?
          <span class="link" id="link-login">Masuk</span></span>
      </div>
      <div class="container-input">
        <div class="container-name">
          <input type="text" placeholder="Nama depan" id="first-name" maxlength="16" autocomplete="off" />
          <input type="text" placeholder="Nama belakang" id="last-name" maxlength="16" autocomplete="off" />
        </div>
        <input type="text" placeholder="Nama pengguna" id="username-register" maxlength="16" autocomplete="off" />
        <div class="password">
          <input type="password" placeholder="Kata sandi" id="password-register" maxlength="32" autocomplete="off" />
          <img class="eye-icon" id="eye-icon-register" src="/assets/visibility_off.svg">
        </div>
      </div>
      <label class="radio">
        <input type="checkbox" value="agree" id="agree-register" />
        <span>Saya menyetujui <span class="link">syarat & ketentuan</span></span></label>
      <div class="container-create">
        <div class="button-create" id="create">
          <span>Buat Akun</span>
        </div>
      </div>
    </div>
    <!-- halaman access -->
    <div class="login" id="login">
      <div class="head-form">
        <span class="hero-form">Masuk</span>
        <span>Tidak punya akun?
          <span class="link" id="link-register">Buat akun</span>
        </span>
      </div>
      <div class="container-input">
        <input type="text" placeholder="Nama pengguna" id="username-login" maxlength="16" autocomplete="off" />
        <div class="password">
          <input type="password" placeholder="Kata sandi" id="password-login" maxlength="32" autocomplete="off" />
          <img class="eye-icon" id="eye-icon-login" src="/assets/visibility_off.svg">
        </div>
      </div>
      <label for="" class="radio">
        <input type="checkbox" value="agree" id="agree-login" autocomplete="off" />
        <span>Saya menyetujui <span class="link">syarat & ketentuan</span></span></label>
      <div class="container-create">
        <div class="button-login" id="connect">
          <span>Masuk</span>
        </div>
      </div>
    </div>
  </div>
  <div class="footer">
    <div class="copyright">
      <span>Sistem Inventaris dirancang & dikembangkan oleh Akmal Rasyid © 2026 Inventory System.</span>
    </div>
  </div>
</body>
<script type="module" src="javascript/connect.js"></script>

</html>
