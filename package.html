<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Package</title>
  <link rel="stylesheet" href="css/package.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div class="sidebar">
    <div class="menu" id="dashboard">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="#e3e3e3">
        <path
          d="M520-600v-240h320v240H520ZM120-440v-400h320v400H120Zm400 320v-400h320v400H520Zm-400 0v-240h320v240H120Zm80-400h160v-240H200v240Zm400 320h160v-240H600v240Zm0-480h160v-80H600v80ZM200-200h160v-80H200v80Zm160-320Zm240-160Zm0 240ZM360-280Z" />
      </svg>
    </div>
    <div class="information-dashboard" id="information-dashboard">
      <span>Dashboard</span>
    </div>
    <div class="menu-page" id="package">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="#e3e3e3">
        <path
          d="M440-183v-274L200-596v274l240 139Zm80 0 240-139v-274L520-457v274Zm-80 92L160-252q-19-11-29.5-29T120-321v-318q0-22 10.5-40t29.5-29l280-161q19-11 40-11t40 11l280 161q19 11 29.5 29t10.5 40v318q0 22-10.5 40T800-252L520-91q-19 11-40 11t-40-11Zm200-528 77-44-237-137-78 45 238 136Zm-160 93 78-45-237-137-78 45 237 137Z" />
      </svg>
    </div>
    <div class="information-package" id="information-package">
      <span>Package</span>
    </div>
    <div style="margin: auto 0 0 0; padding-bottom: 10px;">
      <div class="menu" id="setting">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="#e3e3e3">
          <path
            d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z" />
        </svg>
      </div>
      <div class="information-setting" id="information-setting">
        <span>Setting</span>
      </div>
      <div class="menu" id="log-out">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="#e3e3e3">
          <path
            d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h280v80H200Zm440-160-55-58 102-102H360v-80h327L585-622l55-58 200 200-200 200Z" />
        </svg>
      </div>
      <div class="information-logout" id="information-logout">
        <span>Logout</span>
      </div>
    </div>
  </div>
  <div class="content">
    <div>
      <span class="name-inventory" id="tag-inventory">Loading...</span>
    </div>
    <div class="header-menu">
      <div style="display: flex; align-items: center;">
        <select name="" id="">
          <option value="">All Items</option>
        </select>
      </div>
      <div class="left-menu">
        <div class="menu-button">
          <span>Setting item</span>
        </div>
        <div class="menu-button" id="new-quantity">
          <span>New Quantity</span>
        </div>
      </div>
    </div>
    <div class="table">
      <div class="audit-log">
        <div style="gap: 10px; display: flex;">
          <span>#</span>
          <span>Name</span>
        </div>
        <span>Type</span>
        <span>Category</span>
        <span>Amount</span>
        <span>Price</span>
      </div>
      <div></div>
      <div class="not-found">
        <span style="font-size: 128px;">404</span>
      </div>
    </div>
  </div>
  <div class="new-quantity" id="quantity-popup">
    <div class="popup">
      <div style="display: flex;">
        <span style="color: #111111; font-size: 28px; font-weight: 700;">New Quantity</span>
        <div style="margin: 0 0 0 auto; cursor: pointer;" id="close-mint">
          <svg xmlns="http://www.w3.org/2000/svg" height="28px" viewBox="0 -960 960 960" width="28px" fill="#BB271A">
            <path
              d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
          </svg>
        </div>
      </div>
      <input type="text" placeholder="Name" id="name-mint">
      <input type="text" placeholder="Category" id="category-mint">
      <input type="text" placeholder="Amount" id="amount-mint">
      <input type="text" placeholder="Price" id="price-mint">
      <div class="type-class">
        <span class="type-label">Type item</span>
        <div class="type-option">
          <div class="check">
            <input type="radio" value="new" name="radio" checked>
            <span>New</span>
          </div>
          <div class="check">
            <input type="radio" value="used" name="radio">
            <span>Used</span>
          </div>
        </div>
      </div>
      <div class="button-mint" id="button-mint">
        <span style="font-size: 16px;">Mint</span>
      </div>
    </div>
  </div>
</body>
<script type="module" src="javascript/package.js"></script>

</html>
