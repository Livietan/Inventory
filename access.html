<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory</title>
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="image">
      <img src="package/ChatGPT Image 5 Sep 2026, 12.37.11.png" alt="" />
    </div>
    <div class="content">
      <div class="form">
        <div style="display: flex; flex-direction: column; gap: 10px">
          <span class="head-form">Create an account</span>
          <span
            >Already have an account?
            <span class="link-login">Login</span></span
          >
        </div>
        <div
          style="display: flex; flex-direction: column; gap: var(--gap-input)"
        >
          <div style="display: flex; gap: var(--gap-input)">
            <input type="text" placeholder="Frist name" />
            <input type="text" placeholder="Last name" />
          </div>
          <input type="text" placeholder="Username" />
          <input type="password" placeholder="Password" />
        </div>
        <label for="" class="radio">
          <input class="radio" type="radio" value="agree" />
          I agree to the
          <span style="text-decoration: underline"
            >Terms & Conditions</span
          ></label
        >
        <div
          style="
            text-align: center;
            gap: 10px;
            display: flex;
            flex-direction: column;
          "
        >
          <div class="button-login">
            <span>Create account</span>
          </div>
          <span>Inventory System · Made by Akmal</span>
        </div>
      </div>
    </div>
  </body>
</html>
