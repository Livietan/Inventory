<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Orbitron:wght@400..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Manrope:wght@200..800&family=Orbitron:wght@400..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="header">
        <div class="user">
            <svg xmlns="http://www.w3.org/2000/svg" height="30px" viewBox="0 -960 960 960" width="30px" fill="#e3e3e3">
                <path
                    d="M325-111.5q-73-31.5-127.5-86t-86-127.5Q80-398 80-480.5t31.5-155q31.5-72.5 86-127t127.5-86Q398-880 480.5-880t155 31.5q72.5 31.5 127 86t86 127Q880-563 880-480.5T848.5-325q-31.5 73-86 127.5t-127 86Q563-80 480.5-80T325-111.5ZM480-162q26-36 45-75t31-83H404q12 44 31 83t45 75Zm-104-16q-18-33-31.5-68.5T322-320H204q29 50 72.5 87t99.5 55Zm208 0q56-18 99.5-55t72.5-87H638q-9 38-22.5 73.5T584-178ZM170-400h136q-3-20-4.5-39.5T300-480q0-21 1.5-40.5T306-560H170q-5 20-7.5 39.5T160-480q0 21 2.5 40.5T170-400Zm216 0h188q3-20 4.5-39.5T580-480q0-21-1.5-40.5T574-560H386q-3 20-4.5 39.5T380-480q0 21 1.5 40.5T386-400Zm268 0h136q5-20 7.5-39.5T800-480q0-21-2.5-40.5T790-560H654q3 20 4.5 39.5T660-480q0 21-1.5 40.5T654-400Zm-16-240h118q-29-50-72.5-87T584-782q18 33 31.5 68.5T638-640Zm-234 0h152q-12-44-31-83t-45-75q-26 36-45 75t-31 83Zm-200 0h118q9-38 22.5-73.5T376-782q-56 18-99.5 55T204-640Z" />
            </svg>
            <div style="display: flex; flex-direction: column;">
                <span id="name-tag">Username</span>
            </div>
            <div id="copy-button" style="display: flex; align-items: center;">
                <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                    fill="#FFFFFF">
                    <path
                        d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z" />
                </svg>
            </div>
        </div>
        <div class="logout" id="button-logout">
            <span id="log">Logout</span>
        </div>
    </div>
    <div class="content">
        <div class="head-menu">
            <div style="display: flex; gap: 1rem;">
                <div class="delete" id="delete" style="display: flex; align-items: center; gap: 3px;">
                    <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                        fill="#FF6B53">
                        <path
                            d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z" />
                    </svg>
                    <span>Delete</span>
                </div>
                <div class="shipping" id="shipping" style="display: flex; align-items: center; gap: 3px;">
                    <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                        fill="#3B82F6">
                        <path
                            d="M195-195q-35-35-35-85H60l18-80h113q17-19 40-29.5t49-10.5q26 0 49 10.5t40 29.5h167l84-360H182l4-17q6-28 27.5-45.5T264-800h456l-37 160h117l120 160-40 200h-80q0 50-35 85t-85 35q-50 0-85-35t-35-85H400q0 50-35 85t-85 35q-50 0-85-35Zm442-245h193l4-21-74-99h-95l-28 120Zm-19-273 2-7-84 360 2-7 34-146 46-200ZM20-427l20-80h220l-20 80H20Zm80-146 20-80h260l-20 80H100Zm180 333q17 0 28.5-11.5T320-280q0-17-11.5-28.5T280-320q-17 0-28.5 11.5T240-280q0 17 11.5 28.5T280-240Zm400 0q17 0 28.5-11.5T720-280q0-17-11.5-28.5T680-320q-17 0-28.5 11.5T640-280q0 17 11.5 28.5T680-240Z" />
                    </svg>
                    <span>Shipping</span>
                </div>
            </div>
            <div style="margin: 0 0 0 auto; display: flex; gap: 1rem;">
                <div class="button-edit-item" id="edit-item" style="display: flex; align-items: center; gap: 3px;">
                    <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                        fill="#4DFFFF">
                        <path
                            d="m399-144 97-96h320v96H399Zm-183-72h51l375-375-51-51-375 375v51Zm-72 72v-153l498-498q11-11 24.06-16 13.07-5 27-5 13.94 0 26.94 5 13 5 24 16l51 51q11 11 16 24.05t5 26.55q0 14.4-5.02 27.49Q805.96-652.83 795-642L297-144H144Zm600-549-51-51 51 51Zm-127.95 76.95L591-642l51 51-25.95-25.05Z" />
                    </svg>
                    <span>Edit</span>
                </div>
                <div class="button-add-item" id="add-new" style="display: flex; align-items: center; gap: 3px;">
                    <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                        fill="#4DFFFF">
                        <path d="M444-144v-300H144v-72h300v-300h72v300h300v72H516v300h-72Z" />
                    </svg>
                    <span>New</span>
                </div>
            </div>
        </div>
        <div class="content1">
            <div class="card1">
                <span class="label">Total</span>
                <span class="value" id="total-tag">0</span>
            </div>
            <div class="card2">
                <span class="label">Value</span>
                <span class="value" id="value-tag">0</span>
            </div>
        </div>
        <div class="content2">
            <div class="table">
                <span>#</span>
                <span>Name</span>
                <span>Type</span>
                <span>Amount</span>
                <span>Price $</span>
            </div>
            <div class="data" id="item-pool-tags"></div>
        </div>
    </div>
    <!-- add new -->
    <div class="popup-add" id="popup-add-new">
        <span style="padding-bottom: 5px; font-size: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);">Add your
            item</span>
        <input type="text" placeholder="Name" id="name-add-new" maxlength="16" autocomplete="off">
        <input type="text" placeholder="Type" id="type-add-new" maxlength="16" autocomplete="off">
        <input type="number" placeholder="Amount" id="amount-add-new" autocomplete="off">
        <input type="number" placeholder="Price" id="price-add-new" autocomplete="off">
        <div class="button-add" id="button-add-item">
            <span>Add Item</span>
        </div>
    </div>
    <!-- delete item -->
    <div class="popup-delete" id="popup-delete">
        <span style="padding-bottom: 5px; font-size: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);">Delete
            Your Item</span>
        <input type="text" placeholder="Item Name" id="name-delete-item" autocomplete="off">
        <input type="text" placeholder="Type item" id="type-delete-item" autocomplete="off">
        <div style="display: flex; align-items: center; gap: 5px;">
            <input type="checkbox" value="agree" id="aggree-delete-item">
            <span style="font-size: 14px;">I understand this action cannot be undone.</span>
        </div>
        <div class="delete-item" id="button-delete-item">
            <span>delete</span>
        </div>
    </div>
    <!-- edit item -->
    <div class="popup-edit" id="popup-edit">
        <span style="padding-bottom: 5px; font-size: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);">Edit
            Your Item</span>
        <select class="select-item" id="item-select-edit"></select>
        <input type="text" placeholder="Type" id="type-edit-item" autocomplete="off">
        <input type="number" placeholder="Amount" id="Amount-edit-item" min="0" autocomplete="off">
        <input type="number" placeholder="Price" id="Price-edit-item" min="0" autocomplete="off">
        <div class="edit-item" id="button-edit-item">
            <span>Edit Item</span>
        </div>
    </div>
    <!-- shipping -->
    <div class="popup-shipping" id="popup-shipping">
        <span style="padding-bottom: 5px; font-size: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);">Shipping
            your items</span>
        <input type="text" id="reciever-shipping" placeholder="Signature" maxlength="64" autocomplete="off">
        <input type="text" id="name-item-shipping" placeholder="Name Item" autocomplete="off">
        <input type="text" id="type-item-shipping" placeholder="Type Item" autocomplete="off">
        <input type="number" id="amount-item-shipping" placeholder="Amount" autocomplete="off">
        <div class="shipping-item" id="shipping-send">
            <span>Shipping</span>
        </div>
    </div>
</body>
<script type="module" src="javascript/dashboard.js"></script>

</html>
