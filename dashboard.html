<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Orbitron:wght@400..900&display=swap"

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        rel="stylesheet">
</head>

<body>
    <div class="header">
        <input class="search" type="text" placeholder="Search">
        <div class="user">
            <svg xmlns="http://www.w3.org/2000/svg" height="30px" viewBox="0 -960 960 960" width="30px" fill="#e3e3e3">
                <path
                    d="M325-111.5q-73-31.5-127.5-86t-86-127.5Q80-398 80-480.5t31.5-155q31.5-72.5 86-127t127.5-86Q398-880 480.5-880t155 31.5q72.5 31.5 127 86t86 127Q880-563 880-480.5T848.5-325q-31.5 73-86 127.5t-127 86Q563-80 480.5-80T325-111.5ZM480-162q26-36 45-75t31-83H404q12 44 31 83t45 75Zm-104-16q-18-33-31.5-68.5T322-320H204q29 50 72.5 87t99.5 55Zm208 0q56-18 99.5-55t72.5-87H638q-9 38-22.5 73.5T584-178ZM170-400h136q-3-20-4.5-39.5T300-480q0-21 1.5-40.5T306-560H170q-5 20-7.5 39.5T160-480q0 21 2.5 40.5T170-400Zm216 0h188q3-20 4.5-39.5T580-480q0-21-1.5-40.5T574-560H386q-3 20-4.5 39.5T380-480q0 21 1.5 40.5T386-400Zm268 0h136q5-20 7.5-39.5T800-480q0-21-2.5-40.5T790-560H654q3 20 4.5 39.5T660-480q0 21-1.5 40.5T654-400Zm-16-240h118q-29-50-72.5-87T584-782q18 33 31.5 68.5T638-640Zm-234 0h152q-12-44-31-83t-45-75q-26 36-45 75t-31 83Zm-200 0h118q9-38 22.5-73.5T376-782q-56 18-99.5 55T204-640Z" />
            </svg>
            <div style="display: flex; flex-direction: column;">
                <span id="user-tag">Username</span>
            </div>
        </div>
    </div>
    <div class="content">
        <div class="head-menu">
            <div class="button-add-item" id="button-add-item">
                <span>+add</span>
            </div>
        </div>
        <div class="content1">
            <div class="card1">
                <span class="label">Total</span>
                <span class="value">0</span>
            </div>
            <div class="card2">
                <span class="label">Value</span>
                <span class="value">0</span>
            </div>
        </div>
        <div class="content2">
            <div class="table">
                <span>#</span>
                <span>Name</span>
                <span>Type</span>
                <span>Amount</span>
                <span>Price</span>
            </div>
            <span class="line"></span>
            <div class="data" id="data"></div>
        </div>
    </div>
    <div class="popup-add" id="popup-add">
        <span style="padding-bottom: 5px; font-size: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);">Add your item</span>
        <input type="text" placeholder="Name" id="name" maxlength="16">
        <input type="text" placeholder="Type" id="type" maxlength="16">
        <input type="number" placeholder="Amount" id="amount">
        <input type="number" placeholder="Price" id="price">
        <div class="button-add" id="button-add">
            <span>Add Item</span>
        </div>
    </div>
</body>
<script type="module" src="javascript/dashboard.js"></script>

</html>
